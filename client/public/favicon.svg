<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <!-- Left Hand: Lush Green Gradient -->
    <linearGradient id="greenHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99d98c" />
      <stop offset="60%" stop-color="#76c893" />
      <stop offset="100%" stop-color="#52b69a" />
    </linearGradient>

    <!-- Right Hand: Ocean Teal Gradient -->
    <linearGradient id="tealHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34a0a4" />
      <stop offset="50%" stop-color="#168aad" />
      <stop offset="100%" stop-color="#184e77" />
    </linearGradient>

    <!-- Bottom Cradle Accent Left -->
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76c893" />
      <stop offset="100%" stop-color="#52b69a" />
    </linearGradient>

    <!-- Bottom Cradle Accent Right -->
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#168aad" />
      <stop offset="100%" stop-color="#1a759f" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Left Caring Hand forming left half of heart -->
    <path d="M 200,80 
             C 160,30 100,20 60,65 
             C 20,110 35,185 90,240 
             C 125,275 165,305 200,320 
             C 175,295 145,260 125,230 
             C 95,185 85,135 110,95 
             C 135,55 175,65 200,105 Z" 
          fill="url(#greenHand)" />

    <!-- Right Caring Hand forming right half of heart -->
    <path d="M 200,80 
             C 240,30 300,20 340,65 
             C 380,110 365,185 310,240 
             C 275,275 235,305 200,320 
             C 225,295 255,260 275,230 
             C 305,185 315,135 290,95 
             C 265,55 225,65 200,105 Z" 
          fill="url(#tealHand)" />

    <!-- Supporting Left Fingertip Swirl -->
    <path d="M 100,140 
             C 90,180 110,230 150,270 
             C 180,300 200,315 200,315 
             C 185,300 160,270 140,240 
             C 115,200 105,165 100,140 Z" 
          fill="url(#accentGreen)" opacity="0.85" />

    <!-- Supporting Right Fingertip Swirl -->
    <path d="M 300,140 
             C 310,180 290,230 250,270 
             C 220,300 200,315 200,315 
             C 215,300 240,270 260,240 
             C 285,200 295,165 300,140 Z" 
          fill="url(#accentTeal)" opacity="0.85" />

    <!-- Outer Green Wing Accents -->
    <path d="M 90,140 C 95,190 120,240 165,280 C 145,260 115,215 105,170 C 100,150 95,140 90,140 Z" fill="#99d98c" />
    <path d="M 310,140 C 305,190 280,240 235,280 C 255,260 285,215 295,170 C 300,150 305,140 310,140 Z" fill="#34a0a4" />
  </g>
</svg>
